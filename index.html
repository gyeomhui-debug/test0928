<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 자치행정 협력사업 신청 현황</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--ok:#0f766e;--okbg:#ccfbf1;--no:#b91c1c;--nobg:#fee2e2;--line:#e5e7eb;--accent:#1d4ed8}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1180px;margin:auto;padding:32px 20px 60px} h1{margin:0 0 8px;font-size:30px}.sub{color:var(--muted);margin-bottom:24px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:#fff;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:20px}
.toolbar input{width:160px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:15px}.toolbar button{padding:9px 14px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:150px}.stat b{display:block;font-size:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 16px rgba(15,23,42,.05)}
.local{font-weight:800;font-size:18px}.biz{margin:8px 0 16px;min-height:48px}.money{font-size:20px;font-weight:800}.badge{display:inline-block;margin-top:12px;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:800}.approved{color:var(--ok);background:var(--okbg)}.rejected{color:var(--no);background:var(--nobg)}
.section{margin-top:34px}.sheet{width:100%;height:460px;border:1px solid var(--line);border-radius:14px;background:#fff}.notice{padding:14px 16px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;color:#9a3412;margin-bottom:12px}.small{font-size:13px;color:var(--muted)}.error{padding:14px 16px;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;color:#991b1b}
</style>
</head>
<body><main class="wrap">
<h1>자치행정 협력사업 신청 현황</h1>
<p class="sub">신청목록.json 기반 카드 표시 · 한도액 자동판정 · Google Sheets 임베드</p>
<div class="toolbar">
  <label>한도액(천원) <input id="limit" type="number" value="600000" step="10000"></label>
  <button id="apply">판정 다시 계산</button>
  <span class="small">※ 첨부자료에 공식 한도 기준이 없어 기본값 600,000천원을 적용했습니다.</span>
</div>
<div class="stats" id="stats"></div>
<div class="grid" id="cards"></div>

<section class="section">
<h2>Google Sheets 신청자료</h2>
<div class="notice" id="sheetNotice">Google Sheets 신청자료가 아래에 임베드되어 있습니다. <a id="sheetOpen" href="#" target="_blank" rel="noopener">원본 Sheet 열기</a></div>
<iframe id="sheetFrame" class="sheet" title="Google Sheets 신청자료" loading="lazy"></iframe>
</section>
</main>
<script>
const SHEET_VIEW_URL = "https://docs.google.com/spreadsheets/d/1yNdpFDcqhKrRMoN8KiobCP6Peu6RSjWfVsniTZo8pgQ/edit";
const SHEET_EMBED_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTxI8hwBk8i1V9LqbQEgEoKFOC3lrfHYK7XCMkE5aiInsxAijBeTZcq9bs4xF-4i-3BHTPifVKp5s0Z/pubhtml?gid=740281092&single=true&widget=true&headers=false";
let data=[];
const fmt=n=>Number(n).toLocaleString('ko-KR');
function render(){
  const limit=Number(document.querySelector('#limit').value||0);
  let ok=0,no=0,total=0;
  document.querySelector('#cards').innerHTML=data.map(x=>{
    const approved=Number(x.예산)<=limit; approved?ok++:no++; total+=Number(x.예산)||0;
    return `<article class="card"><div class="local">${x.지자체명}</div><div class="biz">${x.사업명}</div><div class="small">신청 예산</div><div class="money">${fmt(x.예산)} 천원</div><span class="badge ${approved?'approved':'rejected'}">${approved?'승인':'반려'} · ${approved?'한도 이내':'한도 초과'}</span></article>`
  }).join('');
  document.querySelector('#stats').innerHTML=`<div class="stat"><span>총 신청</span><b>${data.length}건</b></div><div class="stat"><span>승인</span><b>${ok}건</b></div><div class="stat"><span>반려</span><b>${no}건</b></div><div class="stat"><span>총 예산</span><b>${fmt(total)}천원</b></div>`;
}
async function loadApplications(){
  const cards=document.querySelector('#cards');
  cards.innerHTML='<div class="notice">신청목록.json을 불러오는 중입니다.</div>';
  if(location.protocol==='file:'){
    cards.innerHTML='<div class="error"><b>JSON 로드 불가</b><br>현재 index.html을 PC에서 직접(file://) 열었습니다.<br><small>브라우저 보안상 로컬 파일의 fetch()가 차단됩니다. Netlify 주소로 접속하거나 로컬 웹서버에서 실행하세요.</small></div>';
    return;
  }
  const paths=['./신청목록.json','/신청목록.json'];
  let lastError=null;
  for(const path of paths){
    try{
      const url=new URL(path,location.href);
      const response=await fetch(url,{cache:'no-store'});
      if(!response.ok) throw new Error(`${url.pathname} HTTP ${response.status}`);
      const json=await response.json();
      if(!Array.isArray(json)) throw new Error('신청목록.json 형식이 배열이 아닙니다.');
      data=json;
      render();
      return;
    }catch(err){ lastError=err; }
  }
  cards.innerHTML=`<div class="error"><b>JSON 로드 실패</b><br>${lastError?.message||'알 수 없는 오류'}<br><small>Netlify 배포 루트에 index.html과 신청목록.json이 함께 있는지 확인하세요.</small></div>`;
}
loadApplications();
document.querySelector('#apply').addEventListener('click',render);
document.querySelector('#sheetOpen').href=SHEET_VIEW_URL;
if(SHEET_EMBED_URL){document.querySelector('#sheetFrame').src=SHEET_EMBED_URL;document.querySelector('#sheetNotice').style.display='none'}
else{document.querySelector('#sheetFrame').style.display='none'}
</script></body></html>
