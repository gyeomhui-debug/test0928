<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>행정정보 통합관리 기본법 조항 검색</title>
<style>
:root{--navy:#17456d;--blue:#3b73a4;--bg:#f4f7fa;--line:#d8e2ea;--text:#17212b;--muted:#667085}
*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:52px 20px 46px}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}
h1{font-size:clamp(30px,5vw,50px);margin:0 0 12px}header p{margin:0;font-size:17px;opacity:.94}
.news{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:-24px 0 28px}.news img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:18px;box-shadow:0 9px 25px #1736512b}
.panel,.card{background:#fff;border:1px solid var(--line);border-radius:16px}.panel{padding:20px;margin-bottom:18px}.search{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
input{flex:1;min-width:260px;padding:14px 16px;border:1px solid #b9c8d5;border-radius:11px;font-size:16px}.count{font-weight:800;color:var(--navy)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;padding-bottom:40px}
.card{padding:20px}.meta{display:flex;gap:10px;align-items:center;margin-bottom:12px}.badge{background:#eaf2f8;color:var(--navy);font-weight:800;padding:5px 10px;border-radius:999px;font-size:13px}
.card h2{margin:0;font-size:20px}.card p{margin:0;line-height:1.7;color:#344054}.empty{grid-column:1/-1;padding:34px;text-align:center;background:#fff;border:1px dashed #aebfcd;border-radius:16px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 34px}@media(max-width:850px){.news{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap"><h1>행정정보 통합관리 기본법</h1><p>본칙 제1조~제14조 · 제목/본문 키워드 검색</p></div></header>
<main class="wrap">
<section class="news" aria-label="카드뉴스">
<img id="news1" alt="카드뉴스 1 - 기본법 구조">
<img id="news2" alt="카드뉴스 2 - 핵심 정의">
<img id="news3" alt="카드뉴스 3 - 국가 책무">
<img id="news4" alt="카드뉴스 4 - 정보 보안">
</section>
<section class="panel"><div class="search"><input id="keyword" type="search" placeholder="예: 공동활용, 개인정보, 데이터 표준, 기본계획"><div id="count" class="count">결과 0건</div></div><p class="note">조항데이터.json을 읽어 제목 또는 본문에 검색어가 포함된 조항만 표시합니다.</p></section>
<section id="cards" class="grid"></section>
</main>
<footer>가상자료 기반 실습용 정적 웹페이지 · 본칙 14조</footer>
<script>
const svgCard=(n,bg,title,lines)=>`<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="${bg}"/><text x="60" y="100" fill="white" font-family="Arial,sans-serif" font-size="36">#${n}</text><text x="60" y="315" fill="white" font-family="Arial,sans-serif" font-size="68" font-weight="700">${title}</text>${lines.map((x,i)=>`<text x="60" y="${435+i*62}" fill="white" font-family="Arial,sans-serif" font-size="43">${x}</text>`).join('')}</svg>`;
[
['news1',1,'#21547f','기본법 구조',['총칙 / 정책 / 의무','표준화 / 운영 / 보칙']],
['news2',2,'#3277a0','핵심 정의',['행정정보 / 통합관리','데이터 표준 / 공동활용']],
['news3',3,'#3e70a3','국가 책무',['기본계획 수립','표준 마련 및 공표','시스템 운영 관리']],
['news4',4,'#123f66','정보 보안',['암호화 의무','접근통제 강화','사고 즉시 보고']]
].forEach(([id,n,bg,t,l])=>document.getElementById(id).src='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svgCard(n,bg,t,l)));
const cards=document.getElementById('cards'),input=document.getElementById('keyword'),count=document.getElementById('count');let data=[];
const n=a=>Number((String(a['조']||'').match(/\d+/)||[999])[0]);
const summary=t=>{const s=String(t||'').replace(/\s+/g,' ').trim();return s.length>180?s.slice(0,180)+'…':s};
function render(){const q=input.value.trim().toLowerCase();const rows=data.filter(a=>((a['제목']||'')+' '+(a['본문']||'')).toLowerCase().includes(q));count.textContent='결과 '+rows.length+'건';cards.innerHTML=rows.length?rows.map(a=>`<article class="card"><div class="meta"><span class="badge">${a['조']}</span><h2>${a['제목']}</h2></div><p>${summary(a['본문'])}</p></article>`).join(''):'<div class="empty">검색 결과가 없습니다.</div>'}
fetch('https://raw.githubusercontent.com/gyeomhui-debug/test0928/main/%EC%A1%B0%ED%95%AD%EB%8D%B0%EC%9D%B4%ED%84%B0.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(x=>{data=x.filter(a=>n(a)>=1&&n(a)<=14).sort((a,b)=>n(a)-n(b));render()}).catch(e=>{cards.innerHTML='<div class="empty">조항데이터.json 로드 실패: '+e.message+'</div>'});input.addEventListener('input',render);
</script>
</body></html>
