<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 안전점검 보고서</title>
  <style>
    :root{--bg:#f4f6f8;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#d1d5db;--accent:#0b5cab;}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink)}
    header{background:#fff;border-bottom:1px solid var(--line);padding:28px 20px} .wrap{max-width:1100px;margin:auto}
    h1{margin:0 0 8px;font-size:30px} .sub{color:var(--muted);margin:0}
    main{padding:24px 20px 48px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
    input{flex:1;min-width:260px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:#fff}
    #count{font-weight:700;color:var(--accent)} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
    .chapter{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);margin-bottom:8px}.card h2{margin:0 0 10px;font-size:20px}.card p{margin:0;color:#374151;line-height:1.65}
    section.resource{margin-top:34px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}.resource h2{margin-top:0}.frame{width:100%;height:420px;border:1px solid var(--line);border-radius:8px;background:#fff}
    .note{font-size:13px;color:var(--muted);line-height:1.55}.error{padding:20px;background:#fff3f3;border:1px solid #fecaca;border-radius:10px;color:#991b1b}
    a{color:var(--accent)}
  </style>
</head>
<body>
<header><div class="wrap"><h1>2026 안전점검 보고서</h1><p class="sub">장별 핵심내용 검색 및 5사실 정합성 매트릭스</p></div></header>
<main class="wrap">
  <div class="toolbar">
    <input id="search" type="search" placeholder="제목 또는 본문 키워드 검색" aria-label="키워드 검색" />
    <span id="count">결과 0건</span>
  </div>
  <div id="cards" class="grid"></div>

  <section class="resource">
    <h2>외부 리소스 · 5사실 정합성 매트릭스</h2>
    <iframe class="frame" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTNYJSLE7YjRqowe2BPNf0qYueySs24o9Jp8yaBQ-yofEbaqxQlv3Bi6tED1hvWow4et5oz8YqVqZ8m/pubhtml?widget=true&amp;headers=false" title="2026 안전점검 5사실 정합성 매트릭스"></iframe>
    <p class="note">Google Sheets의 ‘파일 → 공유 → 웹에 게시’가 활성화되면 위 영역에 매트릭스가 표시됩니다.
      <a href="https://docs.google.com/spreadsheets/d/1rpN7Mj_0Lx7vtK8mIwSoYMlDTSyEvhA0yWJF3969JU8/edit" target="_blank" rel="noopener">정합성 매트릭스 열기</a>
    </p>
  </section>
</main>
<script>
  const cardsEl = document.getElementById('cards');
  const searchEl = document.getElementById('search');
  const countEl = document.getElementById('count');
  let chapters = [];

  function summarize(text, max=150){
    const clean = String(text || '').replace(/\s+/g,' ').trim();
    return clean.length > max ? clean.slice(0,max).trim() + '…' : clean;
  }

  function render(){
    const q = searchEl.value.trim().toLowerCase();
    const filtered = chapters.filter(x => (`${x.제목} ${x.본문}`).toLowerCase().includes(q));
    countEl.textContent = `결과 ${filtered.length}건`;
    cardsEl.innerHTML = '';
    filtered.forEach(x => {
      const card = document.createElement('article'); card.className='card';
      const chapter = document.createElement('span'); chapter.className='chapter'; chapter.textContent=`제 ${x.장}장`;
      const title = document.createElement('h2'); title.textContent=x.제목;
      const body = document.createElement('p'); body.textContent=summarize(x.본문);
      card.append(chapter,title,body); cardsEl.appendChild(card);
    });
  }

  fetch('./장데이터.json')
    .then(r => { if(!r.ok) throw new Error('장데이터.json을 불러오지 못했습니다.'); return r.json(); })
    .then(data => { chapters = data; render(); })
    .catch(err => { cardsEl.innerHTML = `<div class="error">${err.message}<br>웹서버 또는 GitHub Pages에서 실행해 주세요.</div>`; countEl.textContent='결과 0건'; });
  searchEl.addEventListener('input', render);
</script>
</body>
</html>
